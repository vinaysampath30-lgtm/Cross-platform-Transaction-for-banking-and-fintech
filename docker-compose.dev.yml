services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nexuspay
      POSTGRES_USER: nexuspay_app
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nexuspay_dev_password}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuspay_app -d nexuspay"]
      interval: 10s
      timeout: 5s
      retries: 5
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb-dev-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-dev-data:
  mongodb-dev-data:
