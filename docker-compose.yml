services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: nexuspay_app
      PG_PASSWORD: ${PG_PASSWORD:-nexuspay_dev_password}
      PG_NAME: nexuspay
      PG_POOL_MAX: 10
      DB_MONGO_URI: mongodb://mongodb:27017/nexuspay
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_secure_32_char_random_string}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-change_this_access_token_secret_32chars}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change_this_refresh_token_secret_32chars}
      COOKIE_SECRET: ${COOKIE_SECRET:-change_this_cookie_secret_value_32chars}
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      MFA_ENABLED: "true"
      TRANSFER_MFA_THRESHOLD: "1000"
      EMAIL_DEV_PREVIEW: "true"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nexuspay
      POSTGRES_USER: nexuspay_app
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nexuspay_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuspay_app -d nexuspay"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nexuspay
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  mongodb-data:
  api-data:
